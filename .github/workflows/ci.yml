name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq bc
      - name: Lint
        run: shellcheck -S warning nimctl install.sh tests/run.sh
      - name: Test
        run: bash tests/run.sh

  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;

  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --good-text:#0ca30c; --crit-text:#e66767;

  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
  --border:rgba(255,255,255,.10); --accent:#3987e5; --accent-ink:#ffffff; --track:#184f95;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --good-text:#0ca30c; --crit-text:#e66767;

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { font-weight: 650; font-size: 16px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.brand small { color: var(--muted); font-weight: 400; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav button { background: none; border: 0; padding: 6px 10px; border-radius: 6px; color: var(--ink2); cursor: pointer; }
nav button:hover { background: var(--surface-2); color: var(--ink); }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.topright { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.busy { display: none; align-items: center; gap: 6px; color: var(--ink2); font-size: 13px; }
.busy.on { display: inline-flex; }
.spin { width: 12px; height: 12px; border: 2px solid var(--grid); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
main { max-width: 1240px; margin: 0 auto; padding: 16px; padding-bottom: 260px; }
.page { display: none; } .page.on { display: block; }
h1 { font-size: 20px; margin: 4px 0 12px; font-weight: 650; }
h2 { font-size: 15px; margin: 0 0 8px; font-weight: 650; }
h3 { font-size: 13px; margin: 12px 0 6px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: .04em; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); align-items: start; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card.span2 { grid-column: span 2; } @media (max-width: 720px) { .card.span2 { grid-column: span 1; } }
.tile .label { color: var(--ink2); font-size: 13px; }
.tile .value { font-size: 28px; font-weight: 600; line-height: 1.2; margin: 4px 0 2px; }
.tile .sub { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--ink2); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.good .dot { background: var(--good); } .pill.warn .dot { background: var(--warn); } .pill.crit .dot { background: var(--crit); }
.pill.good { color: var(--good-text); } .pill.crit { color: var(--crit-text); }
.muted { color: var(--muted); } .small { font-size: 12px; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
.tnum { font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--surface-2); } .btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; } .btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit-text); border-color: var(--crit); } .btn.small { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: none; color: var(--ink2); }
input[type=text], input[type=password], input[type=number], select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--ink); }
input:disabled { opacity: .6; } textarea { min-height: 70px; resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink2); }
label.field .help { font-size: 12px; color: var(--muted); }
label.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { color: var(--ink2); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.notice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--warn); margin-bottom: 12px; }
.notice.crit { border-left-color: var(--crit); } .notice.good { border-left-color: var(--good); }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 6px 10px; font-size: 12px; min-width: 120px; display: none; z-index: 5; }
.chart .tip .k { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
.chart .tip .k b { font-variant-numeric: tabular-nums; }
.chart .tip .key { width: 12px; height: 0; border-top: 2px solid var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.legend i.line { height: 0; border-top: 2px solid; border-radius: 0; }
.chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.chart-head .sub { color: var(--muted); font-size: 12px; }
.filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.filters .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.filters .seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; color: var(--ink2); }

.meter { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.meter.warn i { background: var(--warn); } .meter.crit i { background: var(--crit); }
.bar-track { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; min-width: 60px; }
.bar-track i { display: block; height: 100%; background: var(--s1); border-radius: 0 3px 3px 0; }
.list { max-height: 420px; overflow: auto; border: 1px solid var(--grid); border-radius: 8px; }
.list .item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--grid); font-size: 13px; }
.list .item:last-child { border-bottom: 0; } .list .item .id { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.console { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -4px 20px rgba(0,0,0,.12); transition: height .2s; height: 240px; display: flex; flex-direction: column; }
.console.collapsed { height: 36px; }
.console-bar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--grid); font-size: 13px; }
.console-bar .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.console pre { margin: 0; padding: 8px 12px; flex: 1; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
.log { max-height: 460px; overflow: auto; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.toast { position: fixed; top: 60px; right: 16px; z-index: 40; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 8px; padding: 10px 14px; max-width: 360px; display: none; }
.toast.on { display: block; }
.hidden { display: none !important; }
.slot-model { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
.chain { margin: 8px 0 0; padding-left: 0; list-style: none; font-size: 12.5px; }
.chain li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 0; border-top: 1px solid var(--grid); }
.chain li .rk { width: 18px; color: var(--muted); font-variant-numeric: tabular-nums; } .chain li .id { flex: 1 1 160px; min-width: 0; word-break: break-all; font-family: ui-monospace, Menlo, monospace; }
.chain li .meta { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
.chain li.paused .id { color: var(--muted); text-decoration: line-through; }
details summary { cursor: pointer; color: var(--ink2); font-size: 13px; }
kbd { background: var(--surface-2); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.sr { position: absolute; left: -9999px; }
</style>
